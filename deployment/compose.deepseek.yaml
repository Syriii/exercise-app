services:
  api:
    environment:
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
    secrets:
      - api_database_password
      - session_secret
      - deepseek_api_key

  worker:
    environment:
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
    secrets:
      - database_password
      - session_secret
      - deepseek_api_key

secrets:
  deepseek_api_key:
    file: ./secrets/deepseek_api_key
