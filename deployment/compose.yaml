name: exercise-app

x-application-environment: &application-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
  WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-45}
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: ${POSTGRES_DB:-exercise}
  DATABASE_USER: ${POSTGRES_USER:-exercise}
  DATABASE_PASSWORD_FILE: /run/secrets/database_password
  SESSION_SECRET_FILE: /run/secrets/session_secret
  TEMP_MEDIA_ROOT: /app/.runtime/media
  WEB_DIST_DIR: /app/apps/web/dist
  DEEPSEEK_VISION_MODEL: ${DEEPSEEK_VISION_MODEL:-deepseek-v4-flash-vision-exp}
  DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-120000}
  IMAGE_UPLOAD_MAX_BYTES: ${IMAGE_UPLOAD_MAX_BYTES:-8388608}
  EXPORT_MAX_BYTES: ${EXPORT_MAX_BYTES:-67108864}
  EXPORT_RETENTION_HOURS: ${EXPORT_RETENTION_HOURS:-168}
  MEDIA_CLEANUP_INTERVAL_SECONDS: ${MEDIA_CLEANUP_INTERVAL_SECONDS:-3600}
  MAX_ACCOUNTS: ${MAX_ACCOUNTS:-10}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-30}
  AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
  WRITE_RATE_LIMIT_MAX: ${WRITE_RATE_LIMIT_MAX:-240}
  WRITE_RATE_LIMIT_WINDOW_SECONDS: ${WRITE_RATE_LIMIT_WINDOW_SECONDS:-60}
  IMAGE_RATE_LIMIT_MAX: ${IMAGE_RATE_LIMIT_MAX:-20}
  IMAGE_RATE_LIMIT_WINDOW_SECONDS: ${IMAGE_RATE_LIMIT_WINDOW_SECONDS:-3600}
  MAX_ACTIVE_IMAGE_ANALYSES_PER_ACCOUNT: ${MAX_ACTIVE_IMAGE_ANALYSES_PER_ACCOUNT:-3}
  TEMP_MEDIA_MAX_BYTES_PER_ACCOUNT: ${TEMP_MEDIA_MAX_BYTES_PER_ACCOUNT:-268435456}

x-application-service: &application-service
  build:
    context: ..
    dockerfile: deployment/Dockerfile
    args:
      APP_BUILD_REVISION: ${APP_BUILD_REVISION:-local}
      DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
      NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:24.19.0-bookworm-slim}
  image: exercise-app:${APP_IMAGE_TAG:-local}
  environment: *application-environment
  secrets:
    - session_secret
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  volumes:
    - temporary_media:/app/.runtime/media
  security_opt:
    - no-new-privileges:true
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exercise}
      POSTGRES_USER: ${POSTGRES_USER:-exercise}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  setup:
    <<: *application-service
    command: ["node", "apps/server/dist/entrypoints/setup.js"]
    healthcheck:
      disable: true
    environment:
      <<: *application-environment
      ADMIN_INITIAL_PASSWORD_FILE: /run/secrets/admin_initial_password
      API_DATABASE_PASSWORD_FILE: /run/secrets/api_database_password
    secrets:
      - database_password
      - session_secret
      - admin_initial_password
      - api_database_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *application-service
    environment:
      <<: *application-environment
      DATABASE_USER: exercise_api
      DATABASE_PASSWORD_FILE: /run/secrets/api_database_password
    secrets:
      - api_database_password
      - session_secret
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  worker:
    <<: *application-service
    command: ["node", "apps/server/dist/entrypoints/worker.js"]
    healthcheck:
      disable: true
    secrets:
      - database_password
      - session_secret
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  integration:
    profiles: ["verification"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: verification
      args:
        APP_BUILD_REVISION: ${APP_BUILD_REVISION:-local}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:24.19.0-bookworm-slim}
    image: exercise-app-verification:${APP_IMAGE_TAG:-local}
    environment:
      NODE_ENV: test
      TEST_DATABASE_HOST: postgres
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_NAME: ${POSTGRES_DB:-exercise}_test
      TEST_DATABASE_USER: ${POSTGRES_USER:-exercise}
      TEST_DATABASE_PASSWORD_FILE: /run/secrets/database_password
      TEST_API_DATABASE_PASSWORD_FILE: /run/secrets/api_database_password
    secrets:
      - database_password
      - api_database_password
    command: ["npm", "run", "test:integration", "--workspace", "@exercise-app/server"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  temporary_media:

secrets:
  database_password:
    file: ./secrets/database_password
  session_secret:
    file: ./secrets/session_secret
  admin_initial_password:
    file: ./secrets/admin_initial_password
  api_database_password:
    file: ./secrets/api_database_password
