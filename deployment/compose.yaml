name: exercise-app

x-application-environment: &application-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: ${POSTGRES_DB:-exercise}
  DATABASE_USER: ${POSTGRES_USER:-exercise}
  DATABASE_PASSWORD_FILE: /run/secrets/database_password
  SESSION_SECRET_FILE: /run/secrets/session_secret
  TEMP_MEDIA_ROOT: /app/.runtime/media
  WEB_DIST_DIR: /app/apps/web/dist

x-application-service: &application-service
  build:
    context: ..
    dockerfile: deployment/Dockerfile
  image: exercise-app:${APP_IMAGE_TAG:-local}
  environment: *application-environment
  secrets:
    - database_password
    - session_secret
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  volumes:
    - temporary_media:/app/.runtime/media
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exercise}
      POSTGRES_USER: ${POSTGRES_USER:-exercise}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  setup:
    <<: *application-service
    command: ["npm", "run", "db:setup:prod", "--workspace", "@exercise-app/server"]
    healthcheck:
      disable: true
    environment:
      <<: *application-environment
      ADMIN_INITIAL_PASSWORD_FILE: /run/secrets/admin_initial_password
    secrets:
      - database_password
      - session_secret
      - admin_initial_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *application-service
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  worker:
    <<: *application-service
    command: ["npm", "run", "start:worker", "--workspace", "@exercise-app/server"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
  temporary_media:

secrets:
  database_password:
    file: ./secrets/database_password
  session_secret:
    file: ./secrets/session_secret
  admin_initial_password:
    file: ./secrets/admin_initial_password
